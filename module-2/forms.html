<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="/search" method="get">
        <label for="user-name">Name</label>
        <input type="text" name="Username" id="user-name">

        <label for="users-email">Email</label>
        <input type="email" name="email" id="users-email">

        <label for="users-password">Password</label>
        <input type="password" name="password" id="users-password">

        <fieldset>
            <legend>Gender</legend>

            <input type="radio" name="gender" value="male" id="male">
            <label for="male">Male</label>


            <input type="radio" name="gender" value="female" id="female">
            <label for="female">Female</label>
        </fieldset>

        <label for="subscribe">Subscribe</label>
        <input type="checkbox" name="subscribed" id="subscribe">

        <label for="city">City</label>
        <select id="city" name="city">
            <option value="">-- Choose --</option>
            <option value="Lhr">Lahore</option>
            <option value="kra">Karachi</option>
            <option value="Isb">Islamabad</option>
            <option value="Que">Quetta</option>
            <option value="Pwr">Peshawar</option>
        </select>


        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>

</html>
