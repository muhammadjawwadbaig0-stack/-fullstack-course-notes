<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact form for sending us your details and a message.">
    <title>Contact</title>
</head>

<body>
    <main>
        <section aria-labelledby="contact-heading">
            <h1 id="contact-heading">Contact Form</h1>
            <p>Please provide the following information for data collection purposes.</p>

            <form action="/submit" method="post">
                <label for="f-name">First Name</label>
                <input type="text" name="first-name" required id="f-name">

                <label for="l-name">Last Name</label>
                <input type="text" name="last-name" required id="l-name">

                <label for="email">Email Address</label>
                <input type="email" name="email-address" required id="email" autocomplete="email">

                <label for="phone-number">Phone Number</label>
                <input type="tel" name="phone-number" required id="phone-number" pattern="[0-9+\-\s]{10,15}"
                    autocomplete="tel" title="10 to 15 digits, + and - allowed">

                <label for="DOB">Date of Birth</label>
                <input type="date" name="date-of-birth" required id="DOB" max="2026-10-12">

                <fieldset>
                    <legend>Gender</legend>

                    <input type="radio" name="gender" id="male" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" name="gender" id="female" value="female" >
                    <label for="female">Female</label>

                    <input type="radio" name="gender" id="other" value="other" >
                    <label for="other">Other</label>
                </fieldset>

                <label for="address">Address</label>
                <input type="text" id="address" name="address" required>

                <label for="city">City</label>
                <input type="text" id="city" name="city" required>

                <label for="province">Province</label>
                <select id="province" name="province" required>
                    <option value="" disabled selected>Please Select</option>
                    <option value="punjab">Punjab</option>
                    <option value="sindh">Sindh</option>
                    <option value="balochistan">Balochistan</option>
                    <option value="kpk">KPK</option>
                </select>

                <label for="postal-code">Postal/Zip code</label>
                <input type="text" name="postal-code" id="postal-code" required inputmode="numeric" pattern="[0-9]{5}"
                    title="5-digit postal code" autocomplete="postal-code">

                <label for="edu-level">Education Level</label>
                <select id="edu-level" name="education-level" required>
                    <option value="" disabled selected>Please Select</option>
                    <option value="high-school">High School</option>
                    <option value="associate-degree">Associate's Degree</option>
                    <option value="bachelor-degree">Bachelor's Degree</option>
                </select>

                <fieldset>
                    <legend>Employment Status</legend>

                    <input type="radio" name="emp-status" id="employed" value="employed" required>
                    <label for="employed">Employed</label>

                    <input type="radio" name="emp-status" id="unemployed" value="unemployed" >
                    <label for="unemployed">Unemployed</label>

                    <input type="radio" name="emp-status" id="student" value="student" >
                    <label for="student">Student</label>
                </fieldset>

                <label for="c-message">Message</label>
                <textarea id="c-message" name="c-message" rows="5"></textarea>

                <button type="submit">Submit</button>
            </form>


        </section>
    </main>

    <footer>
        <p>&copy; Jawwad Baig 2026. All rights reserved.</p>
    </footer>

</body>

</html>
